[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-trade"
version = "0.1.0"
description = "CPU-friendly experimental crypto paper trading with fly-inspired learning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
connectome = ["pyarrow>=16,<24"]

[project.scripts]
flytrade = "flytrade.cli:main"

[tool.setuptools.packages.find]
include = ["flytrade*"]

[tool.setuptools.package-data]
flytrade = ["web/*"]
